schema_version: 1

context:
  name: google-cloud-spanner
  version: "3.65.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 434139bd1439528398cd2a96e390a57182420747c214a33f317bbac64afd9c5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=1.34.0,<3.0.0,!=2.0.*,!=2.1.*,!=2.10.*,!=2.2.*,!=2.3.*,!=2.4.*,!=2.5.*,!=2.6.*,!=2.7.*,!=2.8.*,!=2.9.*
    - google-api-core-grpc
    - google-cloud-core >=1.4.4,<3.0.0
    - grpc-google-iam-v1 >=0.12.4,<1.0.0
    # more restrictive constraint for python >=3.11
    - proto-plus >=1.22.2,<2.0.0
    - sqlparse >=0.4.4
    - protobuf >=4.25.8,<8.0.0
    - grpc-interceptor >=0.15.4
    - opentelemetry-api >=1.22.0
    - opentelemetry-sdk >=1.22.0
    - opentelemetry-semantic-conventions >=0.43b0
    - opentelemetry-resourcedetector-gcp >=1.8.0a0
    - google-cloud-monitoring >=2.16.0
    - mmh3 >=4.1.0
    - libcst >=0.2.5

tests:
  - python:
      imports:
        - google.cloud
        - google.cloud.spanner
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Google Cloud Spanner API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner
  documentation: https://googleapis.dev/python/spanner/latest/index.html

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar
