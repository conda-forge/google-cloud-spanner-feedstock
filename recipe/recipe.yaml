schema_version: 1

context:
  name: google-cloud-spanner
  version: "3.70.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 34eb9bd16c2b66adb534244bd9c2596fefb93905b7f1e739516f9b25fb6df0a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.25.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - google-cloud-core >=2.0.0,<3.0.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0
    - grpc-interceptor >=0.15.4
    - sqlparse >=0.4.4
    - opentelemetry-api >=1.22.0
    - opentelemetry-sdk >=1.22.0
    - opentelemetry-semantic-conventions >=0.43b0
    - opentelemetry-resourcedetector-gcp >=1.8.0a0
    - google-cloud-monitoring >=2.28.0
    - mmh3 >=4.1.0
    # from the libcst extra
    - libcst >=0.2.5

tests:
  - python:
      imports:
        - google.cloud
        - google.cloud.spanner
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Spanner API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner
  documentation: https://googleapis.dev/python/spanner/latest/index.html

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar
